<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse a Number</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Number Reverser</h3>
                        
                        <div class="mb-3">
                            <label for="numInput" class="form-label">Enter a number:</label>
                            <input type="number" id="numInput" class="form-control" placeholder="e.g., 12345">
                        </div>
                        
                        <button onclick="reverseNum()" class="btn btn-primary w-100">Reverse</button>
                        
                        <div class="mt-4 text-center">
                            <p id="result" class="fs-5 fw-bold text-dark mb-0"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function reverseNum() {
            let inputVal = document.getElementById('numInput').value;
            let resultDisplay = document.getElementById('result');

            if (inputVal === "") {
                resultDisplay.innerText = "Please enter a valid number.";
                resultDisplay.className = "fs-5 fw-bold text-danger mb-0"; // Change text to red for errors
                return;
            }

            let num = parseInt(inputVal, 10);
            let isNegative = num < 0;
            num = Math.abs(num); 
            
            let reversed = 0;

            while (num > 0) {
                let lastDigit = num % 10;
                reversed = (reversed * 10) + lastDigit;
                num = Math.floor(num / 10);
            }

            if (isNegative) {
                reversed = -reversed;
            }

            resultDisplay.className = "fs-5 fw-bold text-success mb-0"; // Change text to green for success
            resultDisplay.innerText = "Reversed Number: " + reversed;
        }
    </script>

</body>
</html>
